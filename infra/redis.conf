# Project-local Redis config for the Agent Budget Controller.
#
# Why this exists instead of using /opt/homebrew/etc/redis.conf:
# the Homebrew redis 8.10.0 bottle ships a config with
#   loadmodule ./modules/redisbloom/redisbloom.so   (+ redisearch, rejson, timeseries)
# but the bottle contains no modules/ directory, so redis-server aborts on
# startup ("Can't load module ... server aborting") and `brew services start
# redis` lands in an error state. We need none of those modules, so we run the
# brew-installed binary against this minimal config instead.

bind 127.0.0.1 ::1
port 6379
protected-mode yes
daemonize no

dir ./.data/redis
dbfilename budget-controller.rdb

# Budget counters are a *derived* cache — Postgres call_ledger is the log of
# record and `make reconcile` rebuilds Redis from it. So light persistence is
# enough here; it shortens recovery, it isn't the durability guarantee.
save 60 1000
appendonly no

# Never silently evict a budget counter.
maxmemory-policy noeviction

loglevel notice
logfile ""
